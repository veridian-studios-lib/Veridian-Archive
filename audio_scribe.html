<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veridian | The Audio Scribe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Fauna+One&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #D4AF37; --bg: #050505; }
        body { font-family: 'Fauna One', serif; background: var(--bg); color: var(--gold); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        .player-card { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .disk { width: 200px; height: 200px; border: 2px solid var(--gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; position: relative; transition: 0.5s; }
        .spinning { animation: spin 10s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .controls { background: #111; padding: 40px 20px; border-top: 1px solid #333; }
        .btn-main { width: 80px; height: 80px; border-radius: 50%; border: 2px solid var(--gold); display: flex; align-items: center; justify-content: center; background: rgba(212,175,55,0.1); }
    </style>
</head>
<body>

    <div class="p-6 flex justify-between">
        <button onclick="history.back()" class="text-[10px] tracking-widest opacity-50">← BACK</button>
        <div id="status-tag" class="text-[10px] border border-red-900 px-2 text-red-500">OFFLINE</div>
    </div>

    <div class="player-card">
        <div id="disk-ui" class="disk">
            <div class="w-3 h-3 bg-gold rounded-full"></div>
            <div class="absolute inset-0 border border-white/5 rounded-full scale-75"></div>
        </div>
        <h1 id="title" class="mt-10 text-xl font-serif text-white">Select a Scroll</h1>
        <p id="author" class="text-xs opacity-50 uppercase mt-2 tracking-tighter">Veridian Archive</p>
        <div id="text-pipe" class="mt-10 text-center italic text-sm opacity-80 px-10 h-20">Tap Play to begin transmission...</div>
    </div>

    <audio id="engine" loop src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAA==/"></audio>

    <div class="controls">
        <div class="flex justify-center items-center gap-10">
            <button onclick="changeLine(-1)" class="opacity-50">PREV</button>
            <button onclick="masterToggle()" id="master-btn" class="btn-main">
                <svg id="play-svg" width="30" height="30" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <svg id="pause-svg" class="hidden" width="30" height="30" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
            <button onclick="changeLine(1)" class="opacity-50">NEXT</button>
        </div>
    </div>

    <script>
        const synth = window.speechSynthesis;
        const engine = document.getElementById('engine');
        let book = null, lines = [], current = 0, active = false;

        window.onload = async () => {
            const id = new URLSearchParams(window.location.search).get('id');
            const lib = await localforage.getItem('veridian_library') || [];
            book = lib.find(b => b.id === id);
            if (book) {
                document.getElementById('title').innerText = book.title;
                document.getElementById('author').innerText = book.author;
                lines = book.content.flat();
                setupMediaSession();
            }
        };

        function setupMediaSession() {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: book.title,
                    artist: book.author,
                    album: "Veridian Scriptorium",
                    artwork: [{ src: "https://via.placeholder.com/512/D4AF37/000000?text=V", sizes: "512x512", type: "image/png" }]
                });

                navigator.mediaSession.setActionHandler('play', masterToggle);
                navigator.mediaSession.setActionHandler('pause', masterToggle);
                navigator.mediaSession.setActionHandler('nexttrack', () => changeLine(1));
                navigator.mediaSession.setActionHandler('previoustrack', () => changeLine(-1));
            }
        }

        function masterToggle() {
            if (!active) {
                active = true;
                engine.play().catch(console.error); // Start the real audio "payload"
                speak();
                uiState(true);
            } else {
                active = false;
                engine.pause();
                synth.cancel();
                uiState(false);
            }
        }

        function speak() {
            if (!active || current >= lines.length) return;

            synth.cancel();
            const utterance = new SpeechSynthesisUtterance(lines[current]);
            
            // This is the smart sync
            utterance.onstart = () => {
                document.getElementById('text-pipe').innerText = lines[current];
                // Update position in lockscreen
                if ('mediaSession' in navigator) {
                    navigator.mediaSession.playbackState = "playing";
                }
            };

            utterance.onend = () => {
                if (active) {
                    current++;
                    speak();
                }
            };

            synth.speak(utterance);
        }

        function changeLine(step) {
            current = Math.max(0, Math.min(lines.length - 1, current + step));
            if (active) speak();
            else document.getElementById('text-pipe').innerText = lines[current];
        }

        function uiState(isPlaying) {
            document.getElementById('play-svg').classList.toggle('hidden', isPlaying);
            document.getElementById('pause-svg').classList.toggle('hidden', !isPlaying);
            document.getElementById('disk-ui').classList.toggle('spinning', isPlaying);
            document.getElementById('status-tag').innerText = isPlaying ? "TRANSMITTING" : "OFFLINE";
            document.getElementById('status-tag').classList.toggle('text-green-500', isPlaying);
            document.getElementById('status-tag').classList.toggle('border-green-900', isPlaying);
        }

        // KEEP ALIVE: Prevents phone from sleeping the JS engine
        setInterval(() => {
            if (active && !synth.speaking) {
                // If it should be talking but isn't, kickstart it
                speak();
            }
        }, 5000);
    </script>
</body>
</html>
